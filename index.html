<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Modo Leyenda 🎮</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

body{
  margin:0;
  font-family:'Press Start 2P';
  overflow:hidden;
  color:white;
  text-align:center;
}

/* 🌅 CIELO DINÁMICO */
.sky{
  position:fixed;
  width:100%;
  height:100%;
  background:linear-gradient(#5fb3ff,#aee1ff);
  transition:1s;
  z-index:-10;
}

/* 🌙 NOCHE */
.night{
  background:linear-gradient(#0b1a3a,#1e3c72);
}

/* ⭐ ESTRELLAS */
.star{
  position:fixed;
  width:2px;
  height:2px;
  background:white;
  opacity:0;
  animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
  from{opacity:0;}
  to{opacity:1;}
}

/* 🌿 SUELO */
.ground{
  position:fixed;
  bottom:0;
  width:100%;
  height:30%;
  background:linear-gradient(#2ecc71 20%,#3e8e41 20%);
  z-index:-5;
}

/* 🌳 ÁRBOLES */
.tree{
  position:fixed;
  bottom:30%;
  width:40px;
  height:60px;
  background:#8B5A2B;
}
.tree::after{
  content:"";
  position:absolute;
  width:80px;
  height:60px;
  left:-20px;
  bottom:40px;
  background:#2ecc71;
}

/* 🟨 TITULO */
h1{
  margin-top:30px;
  color:#ffcc00;
  text-shadow:4px 4px #000,6px 6px #000;
}

/* 🎮 BOTONES MINECRAFT */
button{
  font-family:inherit;
  background:#7a7a7a;
  border:4px solid #3a3a3a;
  color:white;
  padding:10px;
  margin:10px;
  cursor:pointer;
}
button:hover{
  background:#9a9a9a;
}

/* 📦 CARTAS */
.card{
  background:rgba(0,0,0,0.8);
  padding:20px;
  margin:20px auto;
  max-width:500px;
  border-radius:10px;
}

/* 🦖 DINO */
.dino{
  position:fixed;
  bottom:0;
  left:50px;
  width:20px;
  height:20px;
  background:#4CAF50;
  transform:scale(2);
  animation:idle 1s infinite alternate;
}

@keyframes idle{
  from{transform:scale(2) translateY(0);}
  to{transform:scale(2) translateY(-5px);}
}

/* 🐰 CONEJO IA */
.rabbit{
  position:fixed;
  bottom:30%;
  left:200px;
  width:20px;
  height:20px;
  background:white;
  transform:scale(1.5);
  transition:0.3s;
}

/* ❤️ CORAZONES */
.heart{
  position:fixed;
  bottom:-10px;
  animation:subir linear forwards;
}

@keyframes subir{
  to{transform:translateY(-110vh);}
}

.hidden{display:none;}

</style>
</head>

<body>

<div class="sky" id="sky"></div>
<div class="ground"></div>

<div class="tree" style="left:10%"></div>
<div class="tree" style="left:40%"></div>
<div class="tree" style="left:70%"></div>

<div class="dino" id="dino"></div>
<div class="rabbit" id="rabbit"></div>

<h1>🌿 FELIZ CUMPLEAÑOS MI AMORCITO 🌿</h1>

<div id="nivel1" class="card">
<p>🎮 Nivel 1</p>
<p>¿Qué eres para mí?</p>
<button onclick="correcto1()">Mi todo 💕</button>
<button onclick="incorrecto()">Un npc 🤨</button>
</div>

<div id="nivel2" class="card hidden">
<p>🍄 Nivel 2</p>
<p>¿Quién es mi persona favorita?</p>
<button onclick="correcto2()">Tú 💖</button>
<button onclick="incorrecto()">Otro 😡</button>
</div>

<div id="nivel3" class="card hidden">
<p>🌸 Nivel 3</p>
<button onclick="finalJuego()">Abrir 🎁</button>
</div>

<div id="final" class="card hidden">
<h2>🎉 FELIZ CUMPLEAÑOS JOHN 🎉</h2>
<p>Has completado el juego 💘</p>
</div>

<!-- 🎵 MUSICA -->
<audio autoplay loop>
<source src="https://cdn.pixabay.com/audio/2022/03/15/audio_c8b2b2db.mp3">
</audio>

<script>

/* 🎮 LOGICA JUEGO */
function correcto1(){
nivel1.classList.add("hidden");
nivel2.classList.remove("hidden");
}

function correcto2(){
nivel2.classList.add("hidden");
nivel3.classList.remove("hidden");
}

function incorrecto(){
alert("❌ intenta otra vez");
}

function finalJuego(){
nivel3.classList.add("hidden");
final.classList.remove("hidden");

setInterval(()=>{
let h=document.createElement("div");
h.className="heart";
h.innerText="❤️";
h.style.left=Math.random()*100+"vw";
h.style.animationDuration=(Math.random()*2+3)+"s";
document.body.appendChild(h);
},300);
}

/* 🌅 DIA/NOCHE */
let day=true;
setInterval(()=>{
day=!day;
sky.classList.toggle("night");

if(!day){
for(let i=0;i<50;i++){
let s=document.createElement("div");
s.className="star";
s.style.left=Math.random()*100+"vw";
s.style.top=Math.random()*50+"vh";
document.body.appendChild(s);
}
}
},8000);

/* 🐰 IA CONEJO */
setInterval(()=>{
let dinoX=document.getElementById("dino").offsetLeft;
let rabbit=document.getElementById("rabbit");

if(dinoX < 300){
rabbit.style.left = "80%";
}else{
rabbit.style.left = "20%";
}
},500);

</script>

</body>
</html>
